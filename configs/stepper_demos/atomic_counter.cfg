; Multi-core LR/SC synchronization demo
;
; Two cores each increment a shared counter 10 times.
; 
; Note: this program requires the rvsim-step stepper with --cpu multicore,
; or a multi-core research platform (future work). The assembly and
; config demonstrate the pattern; single-core execution yields a0 = 10.

[memory]
size = 34K

[memory.init]
; Shared counter at 0x8000 - initially 0
0x8000 = 0

[system]
cores = 2

[pipeline]
forwarding = partial
branch_pred = bimodal_1bit

[registers]
; a0 = core ID (would be set per-core in multi-core mode)
a0 = 0
a1 = 0x8000   ; &counter
a2 = 10       ; increments per core
