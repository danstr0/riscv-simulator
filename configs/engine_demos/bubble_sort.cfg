; Branch predictor stress test
;
; 8-element array in reverse order (worst case for bubble sort).
;
; Usage: rvsim engine_demos/bubble_sort.s --config engine_demos/bubble_sort.cfg

[system]
max_cycles = 1000

[memory]
size = 6K

[memory.init]
; Reverse-sorted array 0x1000
0x1000 = [8, 7, 6, 5, 4, 3, 2, 1]

[registers]
a0 = 8        ; array length
a1 = 0x1000   ; array address

[sweep]
pipeline.branch_pred = [not_taken, always_taken, backward_taken, bimodal_1bit, bimodal_2bit]
pipeline.forwarding = [none, partial]
