; Pointer-chasing benchmark
;
; 8 nodes are scattered across different cache lines to stress
; replacement policy. Each node: [value, next_ptr].
; Nodes are deliberately non-contiguous to defeat prefetching.
;
; List: 10 -> 20 -> 30 -> 40 -> 50 -> 60 -> 70 -> 80 -> null
;
; Usage: rvsim engine_demos/linked_list.s --config engine_demos/linked_list.cfg

[memory]
size = 64K

[memory.init]
; Node 0 at 0x2000: value=10, next=0x2100
0x2000 = [10, 0x2100]
; Node 1 at 0x2100: value=20, next=0x2300
0x2100 = [20, 0x2300]
; Node 2 at 0x2300: value=30, next=0x2600
0x2300 = [30, 0x2600]
; Node 3 at 0x2600: value=40, next=0x2A00
0x2600 = [40, 0x2A00]
; Node 4 at 0x2A00: value=50, next=0x3000
0x2A00 = [50, 0x3000]
; Node 5 at 0x3000: value=60, next=0x3800
0x3000 = [60, 0x3800]
; Node 6 at 0x3800: value=70, next=0x4200
0x3800 = [70, 0x4200]
; Node 7 at 0x4200: value=80, next=0 (null)
0x4200 = [80, 0]

[pipeline]
forwarding = partial
branch_pred = bimodal_2bit

[registers]
a0 = 0x2000   ; head pointer

[sweep]
cache.l1.size = [1K, 2K, 4K, 8K]
cache.l1.replacement = [lru, fifo, random, plru]
